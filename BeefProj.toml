FileVersion = 1
Dependencies = {corlib = "*", corlib = "*"}

[Project]
Name = "FreeType"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)\\dist\\win64\\debug\\freetype.lib", "$(ProjectDir)\\dist\\win64\\debug\\harfbuzz.lib", "$(ProjectDir)\\dist\\win64\\debug\\png16.lib", "$(ProjectDir)\\dist\\win64\\debug\\z.lib", "$(ProjectDir)\\dist\\win64\\debug\\fribidi.lib"]
PostBuildCmds = ["CopyToDependents(\"$(ProjectDir)/dist/win64/debug/fribidi-0.dll\")"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)\\dist\\win64\\release\\freetype.lib", "$(ProjectDir)\\dist\\win64\\release\\harfbuzz.lib", "$(ProjectDir)\\dist\\win64\\release\\png16.lib", "$(ProjectDir)\\dist\\win64\\release\\z.lib", "$(ProjectDir)\\dist\\win64\\release\\fribidi.lib"]
PostBuildCmds = ["CopyToDependents(\"$(ProjectDir)/dist/win64/release/fribidi-0.dll\")"]
